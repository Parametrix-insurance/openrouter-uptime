name: poll

on:
  schedule:
    # An attempt every 5 minutes (GitHub's minimum), off the top of the hour,
    # for a poll every 15.
    #
    # GitHub's scheduler drops runs outright rather than merely delaying them,
    # and :00 is its most congested slot -- under `cron: "0 * * * *"` this
    # collector delivered 43% of its nominal rate over 33 days, with the 01:00
    # UTC hour never sampled at all. Over-scheduling converts a dropped run
    # into one 5 minutes late; scripts/should_poll.py turns the surplus
    # attempts into no-ops against its 12-minute floor, so every third attempt
    # polls and the rest cost a few seconds each.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Poll even if the last one was recent"
        type: boolean
        default: false

# Never let two runs commit at once.
concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      # Floor between polls. Under half the 15-minute target cadence, so a
      # late-but-not-dropped run still counts instead of being suppressed by
      # the one before it.
      MIN_INTERVAL_MIN: "12"

    steps:
      # The repository is ~2 GB of archives and a full checkout took ~210 s of
      # every run, including the two in three that poll nothing. A blobless
      # clone with only the top-level files, scripts/ and status/ takes a few
      # seconds; file contents are fetched on demand, and the day's data files
      # are added once the guard says a poll is due.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/
            /status/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Is a poll due?
        id: guard
        env:
          FORCE_POLL: ${{ inputs.force }}
        run: |
          # Checkout's snapshot can already be seconds stale, and a manual
          # dispatch may have polled in between. Fetching first narrows that
          # window; the push-race check in Commit closes what is left.
          git fetch --quiet origin "${GITHUB_REF_NAME}"
          git checkout --quiet "origin/${GITHUB_REF_NAME}" -- status/latest.json || true
          python3 scripts/should_poll.py

      # poll.py appends to derived/<today>.csv, so that file must be present:
      # a missing one would be recreated with only this run's rows and commit
      # over the day so far. raw/<today>/ only gains a file. Near midnight the
      # poll may write tomorrow's paths instead; those are new, which is safe,
      # and `git add --sparse` below stages them.
      - name: Check out today's data files
        if: steps.guard.outputs.poll == 'true'
        run: |
          day=$(date -u +%F)
          git sparse-checkout add "/derived/${day}.csv" "/raw/${day}/"

      # The only step whose failure should abort the run. What it writes --
      # raw/, derived/, status/ -- is unrecoverable if lost, because OpenRouter
      # reports only current windows and offers no historical endpoint.
      - name: Poll OpenRouter
        if: steps.guard.outputs.poll == 'true'
        run: python3 scripts/poll.py

      # README cosmetics only. A failure here must not discard a good poll, so
      # the commit below runs regardless: a stale README is rebuildable, a
      # missed observation is not.
      - name: Refresh README
        if: steps.guard.outputs.poll == 'true'
        continue-on-error: true
        run: |
          python3 scripts/summarize.py
          python3 scripts/readme_events.py

      - name: Commit
        if: steps.guard.outputs.poll == 'true'
        run: |
          set -euo pipefail
          git config user.name  "openrouter-uptime-bot"
          git config user.email "actions@github.com"
          # --sparse: without it, paths outside the checkout (tomorrow's files
          # after midnight) are refused and the add fails.
          git add -A --sparse
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "poll $(date -u +%Y-%m-%dT%H:%MZ)"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt})"
            git fetch --quiet origin "${GITHUB_REF_NAME}"

            # If another run landed its own poll while this one was working
            # -- the guard cleared at checkout, the race was lost at push --
            # this sample is redundant rather than lost: the window is already
            # covered by an observation seconds away from ours. Drop it and
            # succeed. Reported as a failure, this fires the liveness alarm
            # for a non-problem, and a monitor that cries wolf gets ignored.
            if git show "origin/${GITHUB_REF_NAME}:status/latest.json" \
                 > /tmp/remote-latest.json 2>/dev/null \
               && LATEST_OVERRIDE=/tmp/remote-latest.json \
                  python3 scripts/should_poll.py | grep -q '^poll=false'; then
              echo "another run covered this window; dropping our sample"
              exit 0
            fi

            # Otherwise the remote moved for some other reason (a code push,
            # say), and rebasing is the right thing to try.
            echo "rebasing onto origin/${GITHUB_REF_NAME}"
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "rebase conflicted and the window is not covered; failing"
              exit 1
            fi
            sleep $(( attempt * 3 ))
          done
          echo "push failed after 5 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### poll"
            echo ""
            echo "- due: \`${{ steps.guard.outputs.poll }}\`"
            echo "- age of previous poll: \`${{ steps.guard.outputs.age_minutes }}\` min"
          } >> "$GITHUB_STEP_SUMMARY"
